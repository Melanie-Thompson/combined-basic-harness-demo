services:
  - type: web
    name: agent-harness
    runtime: python
    buildCommand: pip install .
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TOGETHER_API_KEY
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        value: "*"
      - key: LLM_MODEL
        value: Qwen/Qwen3.5-9B
      - key: LLM_BASE_URL
        value: https://api.together.ai/v1
      - key: PYTHON_VERSION
        value: "3.13"
