[project]
name = "agent-harness"
version = "0.2.0"
description = "Agent harness with plan-and-execute LangGraph agent, tool publisher API, and evaluation suite"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "httpx>=0.27",
    "itsdangerous>=2.1",
    "python-dateutil>=2.8",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "langchain-core>=1.8.0",
    "langchain-openai>=1.7.4",
    "langgraph>=0.4.1",
    "cryptography>=44.0",
    "pydantic>=2.0",
    "redis[hiredis]>=5.0",
    "gudhi>=3.10",
    "gradio>=5.0",
]

[project.optional-dependencies]
redis = ["redis[hiredis]>=5.0"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
